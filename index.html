<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Котик Мурчик</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Курсор — кошачья лапка (SVG в data-URI) */
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #fff5e6 0%, #ffe0c0 50%, #ffd1a6 100%);
    font-family: 'Segoe UI', 'Comic Sans MS', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow: hidden;
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><g fill='%23ff8fab' stroke='%23c9184a' stroke-width='1.5'><ellipse cx='9' cy='7' rx='3' ry='4'/><ellipse cx='16' cy='5' rx='3' ry='4.2'/><ellipse cx='23' cy='7' rx='3' ry='4'/><ellipse cx='16' cy='18' rx='7' ry='6'/><circle cx='6' cy='13' r='2.5'/><circle cx='26' cy='13' r='2.5'/></g></svg>") 16 16, auto;
  }

  /* Фон-солнышко и облачка */
  .bg-decor {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.7);
    border-radius: 50px;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
  }
  .cloud::before { width: 60%; height: 120%; top: -40%; left: 10%; }
  .cloud::after { width: 50%; height: 100%; top: -30%; right: 10%; }
  @keyframes drift {
    from { transform: translateX(-200px); }
    to { transform: translateX(calc(100vw + 200px)); }
  }

  .sun {
    position: absolute;
    top: 40px; right: 60px;
    width: 90px; height: 90px;
    background: radial-gradient(circle, #fff3b0, #ffd166 60%, #ffb703);
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(255, 183, 3, 0.6);
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(255,183,3,0.6); }
    50% { transform: scale(1.08); box-shadow: 0 0 60px rgba(255,183,3,0.8); }
  }

  /* Основная карточка */
  .card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(8px);
    border-radius: 28px;
    padding: 2.5rem 2.5rem 2rem;
    box-shadow: 0 18px 50px rgba(200, 120, 60, 0.25), 0 4px 12px rgba(200, 120, 60, 0.15);
    text-align: center;
    max-width: 520px;
    width: 100%;
    border: 3px solid rgba(255, 255, 255, 0.9);
  }

  h1 {
    font-size: 2rem;
    color: #6a4c2b;
    margin-bottom: 0.2rem;
    letter-spacing: 1px;
  }
  .subtitle {
    color: #a0805c;
    font-size: 1rem;
    margin-bottom: 1.5rem;
  }

  /* Сцена с котиком */
  .cat-stage {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 0 auto 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: inherit;
    user-select: none;
  }

  .cat {
    position: relative;
    width: 200px;
    height: 200px;
    transition: transform 0.15s ease;
    transform-origin: center bottom;
  }

  /* Тело котика — из SVG */
  .cat svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 10px 18px rgba(180, 100, 40, 0.3));
    transition: filter 0.3s ease;
  }

  /* Состояния */
  .cat.petting {
    animation: purrShake 0.12s linear infinite;
  }
  @keyframes purrShake {
    0% { transform: translateX(-1.5px) rotate(-1deg); }
    50% { transform: translateX(1.5px) rotate(1deg); }
    100% { transform: translateX(-1.5px) rotate(-1deg); }
  }

  .cat.happy svg {
    filter: drop-shadow(0 10px 18px rgba(180,100,40,0.3)) drop-shadow(0 0 18px rgba(255,180,80,0.8));
  }

  .cat.angry {
    animation: angryShake 0.1s linear infinite;
  }
  @keyframes angryShake {
    0% { transform: translateX(-2px) rotate(-2deg) scale(1.02); }
    50% { transform: translateX(2px) rotate(2deg) scale(1.02); }
    100% { transform: translateX(-2px) rotate(-2deg) scale(1.02); }
  }
  .cat.angry svg {
    filter: drop-shadow(0 10px 18px rgba(200,40,40,0.4)) drop-shadow(0 0 20px rgba(255,60,60,0.6));
  }

  /* Пузырь с репликой */
  .bubble {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%) scale(0.6);
    background: #fff;
    border: 2px solid #ff8fab;
    border-radius: 18px;
    padding: 0.5rem 1rem;
    font-size: 1rem;
    color: #c9184a;
    font-weight: 700;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 6px 16px rgba(255, 120, 150, 0.3);
    z-index: 5;
  }
  .bubble::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 10px 8px 0 8px;
    border-style: solid;
    border-color: #fff transparent transparent transparent;
    filter: drop-shadow(0 2px 0 #ff8fab);
  }
  .bubble.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }
  .bubble.angry {
    border-color: #d62828;
    color: #d62828;
  }
  .bubble.angry::after {
    filter: drop-shadow(0 2px 0 #d62828);
  }
  .bubble.happy {
    border-color: #06d6a0;
    color: #059669;
  }
  .bubble.happy::after {
    filter: drop-shadow(0 2px 0 #06d6a0);
  }

  /* Сердечки */
  .heart {
    position: absolute;
    font-size: 1.4rem;
    pointer-events: none;
    animation: heartUp 1.2s ease-out forwards;
    z-index: 6;
  }
  @keyframes heartUp {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    20% { opacity: 1; transform: translateY(-10px) scale(1.1); }
    100% { transform: translateY(-80px) scale(0.8) rotate(15deg); opacity: 0; }
  }

  /* Гневные молнии */
  .anger-mark {
    position: absolute;
    font-size: 1.5rem;
    pointer-events: none;
    animation: angerPop 0.6s ease-out forwards;
    z-index: 6;
    color: #d62828;
  }
  @keyframes angerPop {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    40% { transform: scale(1.3) rotate(10deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg) translateY(-20px); opacity: 0; }
  }

  /* Статус-бар */
  .status {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 1.2rem;
  }
  .status-chip {
    background: #fff3e0;
    border: 2px solid #ffd1a6;
    border-radius: 20px;
    padding: 0.4rem 0.9rem;
    font-size: 0.9rem;
    color: #a0805c;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.3s ease;
  }
  .status-chip.active {
    background: #ffe0ec;
    border-color: #ff8fab;
    color: #c9184a;
    transform: scale(1.05);
  }
  .status-chip b { font-size: 1.05rem; }

  /* Индикатор настроения */
  .mood-bar-wrap {
    width: 100%;
    max-width: 320px;
    margin: 0 auto 1.2rem;
    background: #ffe8d6;
    border-radius: 20px;
    height: 18px;
    overflow: hidden;
    position: relative;
    border: 2px solid #ffd1a6;
  }
  .mood-bar {
    height: 100%;
    width: 50%;
    border-radius: 16px;
    background: linear-gradient(90deg, #ffb703, #ff8fab, #06d6a0);
    transition: width 0.3s ease;
    box-shadow: 0 0 10px rgba(255, 140, 100, 0.5);
  }
  .mood-label {
    font-size: 0.85rem;
    color: #a0805c;
    margin-bottom: 0.3rem;
  }

  .hint {
    font-size: 0.95rem;
    color: #b08a6a;
    font-style: italic;
    margin-top: 0.5rem;
  }
  .hint b { color: #c9184a; }

  @media (max-width: 480px) {
    .card { padding: 1.8rem 1.2rem; }
    h1 { font-size: 1.6rem; }
    .cat-stage { width: 220px; height: 220px; }
    .cat { width: 170px; height: 170px; }
  }
</style>
</head>
<body>

<div class="bg-decor" id="bgDecor">
  <div class="sun"></div>
</div>

<div class="card">
  <h1>Котик Мурчик</h1>
  <p class="subtitle">Погладь меня… если осмелишься</p>

  <div class="cat-stage" id="catStage">
    <div class="bubble" id="bubble">Мурр~</div>
    <div class="cat" id="cat">
      <!-- SVG котик -->
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- хвост -->
        <path d="M150 150 Q185 140 175 105 Q170 85 155 95" fill="none" stroke="#f4a261" stroke-width="14" stroke-linecap="round"/>
        <!-- тело -->
        <ellipse cx="100" cy="150" rx="62" ry="42" fill="#f4a261"/>
        <ellipse cx="100" cy="158" rx="42" ry="26" fill="#fff1e0"/>
        <!-- лапки -->
        <ellipse cx="70" cy="182" rx="16" ry="10" fill="#f4a261"/>
        <ellipse cx="130" cy="182" rx="16" ry="10" fill="#f4a261"/>
        <!-- голова -->
        <circle cx="100" cy="95" r="52" fill="#f4a261"/>
        <!-- уши -->
        <path d="M58 60 L50 18 L92 48 Z" fill="#f4a261"/>
        <path d="M142 60 L150 18 L108 48 Z" fill="#f4a261"/>
        <path d="M63 55 L58 30 L84 48 Z" fill="#ffb3c6"/>
        <path d="M137 55 L142 30 L116 48 Z" fill="#ffb3c6"/>
        <!-- морда -->
        <ellipse cx="100" cy="108" rx="34" ry="26" fill="#fff1e0"/>
        <!-- глаза -->
        <g id="eyesNormal">
          <ellipse cx="82" cy="88" rx="8" ry="10" fill="#2b2b2b"/>
          <ellipse cx="118" cy="88" rx="8" ry="10" fill="#2b2b2b"/>
          <circle cx="84" cy="85" r="3" fill="#fff"/>
          <circle cx="120" cy="85" r="3" fill="#fff"/>
        </g>
        <!-- глаза злые (скрыты) -->
        <g id="eyesAngry" style="display:none">
          <path d="M72 84 L92 92" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
          <path d="M128 84 L108 92" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
          <path d="M74 96 L90 92" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
          <path d="M126 96 L110 92" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
        </g>
        <!-- глаза счастливые (скрыты) -->
        <g id="eyesHappy" style="display:none">
          <path d="M72 90 Q82 80 92 90" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
          <path d="M108 90 Q118 80 128 90" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
        </g>
        <!-- нос -->
        <path d="M96 102 L104 102 L100 108 Z" fill="#ff8fab"/>
        <!-- рот -->
        <g id="mouthNormal">
          <path d="M100 108 Q94 116 88 112" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M100 108 Q106 116 112 112" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <g id="mouthAngry" style="display:none">
          <path d="M86 116 Q100 106 114 116" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
          <!-- клыки -->
          <path d="M92 112 L94 120 L96 112 Z" fill="#fff" stroke="#2b2b2b" stroke-width="1"/>
          <path d="M104 112 L106 120 L108 112 Z" fill="#fff" stroke="#2b2b2b" stroke-width="1"/>
        </g>
        <!-- усы -->
        <g stroke="#a0805c" stroke-width="1.5" stroke-linecap="round">
          <line x1="60" y1="104" x2="84" y2="108"/>
          <line x1="58" y1="112" x2="84" y2="112"/>
          <line x1="140" y1="104" x2="116" y2="108"/>
          <line x1="142" y1="112" x2="116" y2="112"/>
        </g>
        <!-- румянец -->
        <ellipse cx="68" cy="104" rx="9" ry="6" fill="#ffb3c6" opacity="0.6"/>
        <ellipse cx="132" cy="104" rx="9" ry="6" fill="#ffb3c6" opacity="0.6"/>
      </svg>
    </div>
  </div>

  <div class="mood-label">Настроение Мурчика</div>
  <div class="mood-bar-wrap">
    <div class="mood-bar" id="moodBar"></div>
  </div>

  <div class="status">
    <div class="status-chip" id="chipPet"><b>🐾</b> Гладят</div>
    <div class="status-chip" id="chipPurr"><b>🎵</b> Мурчит</div>
    <div class="status-chip" id="chipAngry"><b>💢</b> Злится</div>
  </div>

  <p class="hint">Наведи и <b>держи</b> курсор на котике, чтобы гладить.<br>Отпусти — и он обидится…</p>
</div>

<script>
  const cat = document.getElementById('cat');
  const catStage = document.getElementById('catStage');
  const bubble = document.getElementById('bubble');
  const moodBar = document.getElementById('moodBar');
  const chipPet = document.getElementById('chipPet');
  const chipPurr = document.getElementById('chipPurr');
  const chipAngry = document.getElementById('chipAngry');
  const eyesNormal = document.getElementById('eyesNormal');
  const eyesAngry = document.getElementById('eyesAngry');
  const eyesHappy = document.getElementById('eyesHappy');
  const mouthNormal = document.getElementById('mouthNormal');
  const mouthAngry = document.getElementById('mouthAngry');

  // --- Состояние ---
  let isPetting = false;
  let mood = 50;            // 0..100
  let purrInterval = null;
  let angerTimer = null;
  let moodTimer = null;
  let lastHeart = 0;

  const purrSounds = ['Мурр~', 'Мрррр…', 'Мур-мур-мур', 'Прррр~', 'Мяу~ ❤', 'Муррррр'];
  const angrySounds = ['Мяу! 😾', 'Шшш!', 'Не трогай!', 'Хвост дёргается!', 'Мяу-мяу! 💢', 'Обиделся!'];

  // --- Облачка ---
  function createClouds() {
    const decor = document.getElementById('bgDecor');
    for (let i = 0; i < 5; i++) {
      const c = document.createElement('div');
      c.className = 'cloud';
      const w = 80 + Math.random() * 120;
      c.style.width = w + 'px';
      c.style.height = (w * 0.45) + 'px';
      c.style.top = (5 + Math.random() * 70) + 'vh';
      c.style.animationDuration = (25 + Math.random() * 35) + 's';
      c.style.animationDelay = (-Math.random() * 40) + 's';
      c.style.opacity = 0.4 + Math.random() * 0.4;
      decor.appendChild(c);
    }
  }
  createClouds();

  // --- Пузырь ---
  function showBubble(text, type = '') {
    bubble.textContent = text;
    bubble.className = 'bubble show ' + type;
  }
  function hideBubble(delay = 1200) {
    clearTimeout(bubble._t);
    bubble._t = setTimeout(() => bubble.classList.remove('show'), delay);
  }

  // --- Сердечко ---
  function spawnHeart() {
    const now = Date.now();
    if (now - lastHeart < 180) return;
    lastHeart = now;
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = ['❤️', '💕', '💖', '🐾'][Math.floor(Math.random() * 4)];
    const rect = catStage.getBoundingClientRect();
    h.style.left = (20 + Math.random() * 60) + '%';
    h.style.top = (30 + Math.random() * 30) + '%';
    catStage.appendChild(h);
    setTimeout(() => h.remove(), 1200);
  }

  // --- Молния гнева ---
  function spawnAnger() {
    const a = document.createElement('div');
    a.className = 'anger-mark';
    a.textContent = ['💢', '⚡', '😾', '💥'][Math.floor(Math.random() * 4)];
    a.style.left = (10 + Math.random() * 80) + '%';
    a.style.top = (10 + Math.random() * 40) + '%';
    catStage.appendChild(a);
    setTimeout(() => a.remove(), 600);
  }

  // --- Настроение ---
  function setMood(v) {
    mood = Math.max(0, Math.min(100, v));
    moodBar.style.width = mood + '%';
  }

  // --- Выражение морды ---
  function setFace(face) {
    // face: 'normal' | 'happy' | 'angry'
    eyesNormal.style.display = face === 'normal' ? '' : 'none';
    eyesHappy.style.display = face === 'happy' ? '' : 'none';
    eyesAngry.style.display = face === 'angry' ? '' : 'none';
    mouthNormal.style.display = face === 'angry' ? 'none' : '';
    mouthAngry.style.display = face === 'angry' ? '' : 'none';
  }

  // --- Чипы ---
  function setChips(petting, purring, angry) {
    chipPet.classList.toggle('active', petting);
    chipPurr.classList.toggle('active', purring);
    chipAngry.classList.toggle('active', angry);
  }

  // --- Начать гладить ---
  function startPetting() {
    if (isPetting) return;
    isPetting = true;

    // Отменяем гнев
    clearTimeout(angerTimer);
    cat.classList.remove('angry');
    cat.classList.add('petting', 'happy');
    setFace('happy');
    setChips(true, true, false);

    // Мурчание
    const purr = () => {
      showBubble(purrSounds[Math.floor(Math.random() * purrSounds.length)], 'happy');
      hideBubble(900);
      spawnHeart();
      setMood(mood + 8);
    };
    purr();
    clearInterval(purrInterval);
    purrInterval = setInterval(purr, 600);
  }

  // --- Перестать гладить → злится ---
  function stopPetting() {
    if (!isPetting) return;
    isPetting = false;

    clearInterval(purrInterval);
    cat.classList.remove('petting', 'happy');
    setChips(false, false, true);

    // Злость
    cat.classList.add('angry');
    setFace('angry');
    setMood(mood - 25);

    showBubble(angrySounds[Math.floor(Math.random() * angrySounds.length)], 'angry');
    hideBubble(1600);
    spawnAnger();
    spawnAnger();

    // Через 2.5 сек успокаивается
    clearTimeout(angerTimer);
    angerTimer = setTimeout(() => {
      cat.classList.remove('angry');
      setFace('normal');
      setChips(false, false, false);
      setMood(50);
      hideBubble(0);
    }, 2500);
  }

  // --- События мыши ---
  catStage.addEventListener('mouseenter', startPetting);
  catStage.addEventListener('mouseleave', stopPetting);
  catStage.addEventListener('mousedown', startPetting);
  catStage.addEventListener('mouseup', stopPetting);

  // --- Тач-события (телефон) ---
  catStage.addEventListener('touchstart', (e) => {
    e.preventDefault();
    startPetting();
  }, { passive: false });
  catStage.addEventListener('touchend', (e) => {
    e.preventDefault();
    stopPetting();
  }, { passive: false });
  catStage.addEventListener('touchcancel', stopPetting);

  // --- Пассивное успокоение ---
  moodTimer = setInterval(() => {
    if (!isPetting && !cat.classList.contains('angry')) {
      setMood(mood + (mood < 50 ? 1 : -1));
    }
  }, 1500);

  // Стартовое состояние
  setFace('normal');
  setMood(50);
</script>
</body>
</html>
